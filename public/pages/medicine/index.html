<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Medicine - Habit Sync</title>
    <link rel="icon" href="../../assets/images/icons/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="../../assets/images/icons/logo.png">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/custom.css">
    <script src="../../assets/js/components/favicon.js" defer></script>
</head>
<body class="bg-gray-50">
    <!-- Navbar (shared component) -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50" data-app-navbar></nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-4xl font-bold text-gray-900">My Medicine</h1>
                <p class="text-gray-600 mt-1">Hello User, stay on top of your health!</p>
            </div>
            <button id="addMedicineBtn" class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <span>+ Add Medicine</span>
            </button>
        </div>

        <!-- Medicine List -->
        <div id="medicineList" class="space-y-4">
            <!-- Item -->
            <div class="bg-white rounded-xl shadow-sm p-5 hover:shadow-md transition-shadow flex items-start gap-4 border border-gray-100">
                <div class="w-9 h-9 rounded-lg bg-green-100 flex items-center justify-center">
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-semibold text-gray-900">Take Allergy Medicine</p>
                    <p class="text-sm text-gray-500">8:00 AM, Daily</p>
                </div>
                <div class="flex items-center gap-3">
                    <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg" aria-label="Edit">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4h2a2 2 0 012 2v2h2a2 2 0 012 2v2h-2v2a2 2 0 01-2 2h-2v2a2 2 0 01-2 2h-2v-2H9a2 2 0 01-2-2v-2H5v-2a2 2 0 012-2h2V6a2 2 0 012-2z"/></svg>
                    </button>
                    <button class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg" aria-label="Delete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </div>
            <!-- Item -->
            <div class="bg-white rounded-xl shadow-sm p-5 hover:shadow-md transition-shadow flex items-start gap-4 border border-gray-100">
                <div class="w-9 h-9 rounded-lg bg-green-100 flex items-center justify-center">
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-semibold text-gray-900">Call the doctor's office</p>
                    <p class="text-sm text-gray-500">2:00 PM, One-time</p>
                </div>
                <div class="flex items-center gap-3">
                    <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg" aria-label="Edit">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4h2a2 2 0 012 2v2h2a2 2 0 012 2v2h-2v2a2 2 0 01-2 2h-2v2a2 2 0 01-2 2h-2v-2H9a2 2 0 01-2-2v-2H5v-2a2 2 0 012-2h2V6a2 2 0 012-2z"/></svg>
                    </button>
                    <button class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg" aria-label="Delete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </div>
            <!-- Item -->
            <div class="bg-white rounded-xl shadow-sm p-5 hover:shadow-md transition-shadow flex items-start gap-4 border border-gray-100">
                <div class="w-9 h-9 rounded-lg bg-green-100 flex items-center justify-center">
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-semibold text-gray-900">Take Iron Supplement</p>
                    <p class="text-sm text-gray-500">7:00 PM, Mon, Wed, Fri</p>
                </div>
                <div class="flex items-center gap-3">
                    <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg" aria-label="Edit">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4h2a2 2 0 012 2v2h2a2 2 0 012 2v2h-2v2a2 2 0 01-2 2h-2v2a2 2 0 01-2 2h-2v-2H9a2 2 0 01-2-2v-2H5v-2a2 2 0 012-2h2V6a2 2 0 012-2z"/></svg>
                    </button>
                    <button class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg" aria-label="Delete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="medicineModal" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-3xl font-bold text-gray-900">Add Medicine</h2>
                    <button id="closeMedicineModal" class="p-2 text-gray-500 hover:text-gray-700" aria-label="Close">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <form id="medicineForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
                        <input type="text" id="medName" placeholder="e.g. Take Allergy Medicine" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Time</label>
                            <div class="relative">
                                <input type="time" id="medTime" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3"/></svg>
                                </span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Frequency</label>
                            <select id="medFrequency" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="Daily" selected>Daily</option>
                                <option value="One-time">One-time</option>
                                <option value="Weekly">Weekly</option>
                                <option value="Custom">Custom</option>
                            </select>
                        </div>
                    </div>
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="medComplete" class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        <span class="text-gray-700">Mark as complete</span>
                    </label>
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">Save Medicine</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../../assets/js/components/navbar.js" defer></script>
    <script src="../../assets/js/main.js" defer></script>
    <script type="module" src="../../assets/js/pages/medicine.js"></script>
</body>
</html>
